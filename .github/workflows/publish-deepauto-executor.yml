name: Publish DeepAuto Executor

on:
  workflow_dispatch:

permissions: {}

jobs:
  publish:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435

      - uses: docker/login-action@184bdaa0721073962dff0199f1fb9940f07167d1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - id: metadata
        uses: docker/metadata-action@369eb591f429131d6889c46b94e711f089e6ca96
        with:
          images: ghcr.io/liaowenjie15/deepauto-executor
          tags: |
            type=raw,value=codex-0.163.0-${{ github.sha }}

      - id: build
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83
        with:
          context: .
          file: Dockerfile.executor
          push: true
          tags: ${{ steps.metadata.outputs.tags }}

      - run: echo "ghcr.io/liaowenjie15/deepauto-executor@${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"

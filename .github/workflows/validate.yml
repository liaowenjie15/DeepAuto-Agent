name: Validation

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: deepauto_test
          POSTGRES_PASSWORD: deepauto_test
          POSTGRES_DB: deepauto_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U deepauto_test -d deepauto_test"
          --health-interval 3s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6380:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - name: Install dependencies
        id: install
        run: bun install --frozen-lockfile
      - name: Generate Prisma client
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: bun run db:generate
      - name: Verify validation targets
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: bun run verify:targets
      - name: Lint
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: bun run lint
      - name: Typecheck
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: bun run typecheck
      - name: Build
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: bun run build
      - name: Unit tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: bun run test:unit
      - name: Integration tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: bun run test:integration

name: deepauto-test

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: deepauto_test
      POSTGRES_PASSWORD: deepauto_test
      POSTGRES_DB: deepauto_test
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 10

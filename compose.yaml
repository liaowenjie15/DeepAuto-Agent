name: deepauto

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-deepauto}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-deepauto_local}
      POSTGRES_DB: ${POSTGRES_DB:-deepauto}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - deepauto_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - deepauto_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 10

volumes:
  deepauto_postgres_data:
  deepauto_redis_data:
